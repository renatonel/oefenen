[package]
name = "oefenen"
version = "0.1.0"
edition = "2024"
description = "Terminal learning app for Dutch primary school children"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
rand = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
toml = "1.1"
uuid = { version = "1.26", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
